<div class="timeline-item">
    <div class="timeline-content">
        <h3 class="timeline-title">{{text:title}}</h3>
        <p class="timeline-date">{{text:date}}</p>
        <p>{{html:description}}</p>
        <div class="timeline-photos">
            {{value:photos}}
        </div>
    </div>
</div>
