<a class="photo-item photo-item-{{value:tile}}" href="{{value:full}}" data-photo-group="gallery" data-caption="{{text:caption}}" aria-label="{{value:label}}">
    <img src="{{value:thumbnail}}" alt="" width="{{value:width}}" height="{{value:height}}" srcset="{{value:srcset}}" sizes="{{value:sizes}}" decoding="async" loading="lazy">
    <div class="photo-overlay"><p>{{text:caption}}</p></div>
</a>
