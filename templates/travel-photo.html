<a class="travel-photo-link" href="{{value:full}}" data-photo-group="{{value:group}}" data-caption="{{text:title}}" aria-label="{{value:label}}">
    <img src="{{value:thumbnail}}" alt="" class="travel-photo" width="{{value:width}}" height="{{value:height}}" srcset="{{value:srcset}}" sizes="(max-width: 600px) 45vw, (max-width: 900px) 42vw, 23vw" decoding="async" loading="lazy">
    <span class="photo-index" aria-hidden="true">{{value:index}}</span>
</a>
