<!doctype html>
<!-- Generated by npm run build. Edit data/pages/ and templates/. -->
<html lang="{{value:htmlLanguage}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{text:meta.title}}</title>
  <meta name="description" content="{{text:meta.description}}">
  <link rel="canonical" href="{{value:canonical}}">
  <link rel="alternate" hreflang="en" href="{{value:englishUrl}}">
  <link rel="alternate" hreflang="zh-CN" href="{{value:chineseUrl}}">
  <meta property="og:type" content="{{value:pageType}}">
  <meta property="og:title" content="{{text:meta.title}}">
  <meta property="og:description" content="{{text:meta.description}}">
  <meta property="og:url" content="{{value:canonical}}">
  <meta property="og:locale" content="{{value:ogLocale}}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/site.css">
  {{value:extraHead}}
  <script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="{{value:page}}" data-lang="{{value:locale}}">
  <a class="skip-link" href="#main">{{text:shared.nav.skip}}</a>
  <header class="site-header"><div class="site-header-inner">
    <a class="site-brand" href="/{{value:locale}}/" aria-label="{{text:shared.nav.brandLabel}}">Zichen <span>Zhao</span><small>赵子辰</small></a>
    <button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" aria-label="{{text:shared.nav.open}}"><span></span><span></span><span></span></button>
    <nav id="site-nav" class="site-nav" aria-label="{{text:shared.nav.label}}"><ul>{{value:navigation}}</ul></nav>
    <a class="language-link" href="{{value:otherPath}}" data-language="{{value:otherLocale}}" lang="{{value:otherLanguage}}" aria-label="{{text:shared.nav.languageLabel}}">{{text:shared.nav.languageLink}}</a>
  </div></header>
  {{value:content}}
  <footer class="site-footer"><div class="container footer-inner"><p>{{text:shared.footer.credit}}</p><div><a href="mailto:brucezhaozichen@126.com">{{text:shared.footer.email}}</a><a href="https://github.com/BruceZhao0728" rel="noopener noreferrer">GitHub</a></div></div></footer>
  <script src="/js/site.js?v={{value:siteVersion}}" defer></script>{{value:extraScripts}}
</body>
</html>
