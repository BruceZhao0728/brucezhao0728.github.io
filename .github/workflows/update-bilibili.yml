name: Update Bilibili Videos

on:
  # 每天北京时间 8:00 和 20:00 各跑一次
  schedule:
    - cron: '0 0 * * *'   # UTC 00:00 = 北京时间 08:00
    - cron: '0 12 * * *'  # UTC 12:00 = 北京时间 20:00

  # 也允许手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 允许 push 提交

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Bilibili videos
        run: python fetch_bilibili.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet data/bilibili-videos.json; then
            echo "No changes detected, skipping commit."
          else
            git add data/bilibili-videos.json
            git commit -m "🤖 Auto-update Bilibili video data"
            git push
            echo "Changes committed and pushed!"
          fi
