<article class="blog-card" data-category="{{value:category}}" data-tags="{{value:tags}}" data-date="{{value:date}}" data-search="{{value:search}}">
  <a class="blog-card-link" href="{{value:href}}">
    <span class="eyebrow"><time datetime="{{value:date}}">{{value:displayDate}}</time> · {{value:categoryLabel}} · {{text:shared.blog.originalLanguage}}</span>
    <h2>{{value:title}}</h2>
    <p>{{value:excerpt}}</p>
    <span class="text-link">{{text:readArticle}}</span>
  </a>
</article>
